name: Deploy Staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: portfolio-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'agent/cloud-bootstrap-v0-1' || github.head_ref == 'agent/valuation-v0-3' || github.head_ref == 'agent/fx-cost-pool-v0-4' || github.head_ref == 'agent/performance-xirr-v0-5' || github.head_ref == 'agent/historical-nav-v0-6' || github.head_ref == 'agent/security-dependency-remediation-v0-7' || github.head_ref == 'agent/transaction-lineage-stale-v0-8' || github.head_ref == 'codex/market-data-scheduler-freshness-v1'))
    name: Resolve Access, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: portfolio-analyzer-staging
      CLOUDFLARE_D1_LOCATION: apac
      CLOUDFLARE_WORKER_NAME: portfolio-analyzer-staging
      CLOUDFLARE_ACCESS_APP_DOMAIN: portfolio-analyzer-staging.techtwc.workers.dev
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: https://techtwc.cloudflareaccess.com
      CLOUDFLARE_MARKET_REFRESH_CRON: "0 23 * * 1-5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install dependencies
        run: |
          sha256sum --check vendor/SHA256SUMS
          npm ci

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Resolve or create staging D1
        id: d1
        run: node scripts/resolve-d1.mjs

      - name: Resolve Cloudflare Access audience
        id: access
        run: node scripts/resolve-access.mjs

      - name: Render staging Wrangler configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          CLOUDFLARE_ACCESS_AUD: ${{ steps.access.outputs.access_aud }}
        run: node scripts/render-wrangler-config.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.staging.generated.jsonc

      - name: Deploy staging Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config .wrangler.staging.generated.jsonc 2>&1 | tee deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL" || (echo "Could not find the workers.dev URL in deploy output" && exit 1)
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed Worker
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/smoke-test.mjs "$DEPLOYMENT_URL" 2>&1 | tee smoke-test.log

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-diagnostics
          path: |
            deploy.log
            smoke-test.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          echo "## Portfolio staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`$CLOUDFLARE_WORKER_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: \`$CLOUDFLARE_D1_DATABASE_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 ID: \`$DATABASE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Access AUD: resolved automatically" >> "$GITHUB_STEP_SUMMARY"
          echo "- Market refresh Cron: \`$CLOUDFLARE_MARKET_REFRESH_CRON\` (UTC)" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: passed" >> "$GITHUB_STEP_SUMMARY"

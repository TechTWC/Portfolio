name: Deploy Staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: portfolio-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/cloud-bootstrap-v0-1')
    name: Create D1, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: portfolio-analyzer-staging
      CLOUDFLARE_D1_LOCATION: apac
      CLOUDFLARE_WORKER_NAME: portfolio-analyzer-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Resolve or create staging D1
        id: d1
        run: node scripts/resolve-d1.mjs

      - name: Render staging Wrangler configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: node scripts/render-wrangler-config.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.staging.generated.jsonc

      - name: Deploy staging Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .wrangler.staging.generated.jsonc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test deployed Worker
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/smoke-test.mjs "$DEPLOYMENT_URL"

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          echo "## Portfolio staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`$CLOUDFLARE_WORKER_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: \`$CLOUDFLARE_D1_DATABASE_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 ID: \`$DATABASE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: passed" >> "$GITHUB_STEP_SUMMARY"

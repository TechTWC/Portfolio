name: Deploy Personal Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA currently at main
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: portfolio-personal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify owner-only Access, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_D1_DATABASE_NAME: portfolio-analyzer-production
      CLOUDFLARE_D1_LOCATION: apac
      CLOUDFLARE_WORKER_NAME: portfolio-analyzer
      CLOUDFLARE_ACCESS_APP_DOMAIN: portfolio-analyzer.techtwc.workers.dev
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: https://techtwc.cloudflareaccess.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Require the exact current main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || (echo "A full lowercase 40-character commit SHA is required" && exit 1)
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA" || (echo "Checked-out commit does not match the requested SHA" && exit 1)
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$REQUESTED_SHA" || (echo "Requested commit is not the current main HEAD" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check protected personal Email input
        env:
          CLOUDFLARE_PERSONAL_EMAIL: ${{ secrets.CLOUDFLARE_PERSONAL_EMAIL }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_PERSONAL_EMAIL" || (echo "Missing CLOUDFLARE_PERSONAL_EMAIL" && exit 1)

      - name: Install locked dependencies
        run: |
          sha256sum --check vendor/SHA256SUMS
          npm ci

      - name: Validate application
        run: |
          npm run audit:production
          npm run audit:all
          npm test
          npm run typecheck
          npm run build

      - name: Verify one-person Cloudflare Access policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PERSONAL_EMAIL: ${{ secrets.CLOUDFLARE_PERSONAL_EMAIL }}
        run: node scripts/verify-personal-access.mjs

      - name: Resolve or create production D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/resolve-d1.mjs

      - name: Resolve Cloudflare Access audience
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/resolve-access.mjs

      - name: Render production Wrangler configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          CLOUDFLARE_ACCESS_AUD: ${{ steps.access.outputs.access_aud }}
        run: node scripts/render-wrangler-config.mjs wrangler.jsonc .wrangler.production.generated.jsonc

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.production.generated.jsonc

      - name: Deploy Personal Production Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config .wrangler.production.generated.jsonc 2>&1 | tee deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL" || (echo "Could not find the workers.dev URL in deploy output" && exit 1)
          test "$DEPLOYMENT_URL" = "https://$CLOUDFLARE_ACCESS_APP_DOMAIN" || (echo "Deployment URL does not match the protected Access application" && exit 1)
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Re-verify one-person Access after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PERSONAL_EMAIL: ${{ secrets.CLOUDFLARE_PERSONAL_EMAIL }}
        run: node scripts/verify-personal-access.mjs

      - name: Verify unauthenticated requests are blocked by Access
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/probe-access-enforcement.mjs "$DEPLOYMENT_URL"

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "## Portfolio Personal Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ inputs.commit_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`$CLOUDFLARE_WORKER_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: \`$CLOUDFLARE_D1_DATABASE_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Access: exactly one configured personal Email" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Access enforcement probe: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authenticated Worker health check: pending manual acceptance" >> "$GITHUB_STEP_SUMMARY"
